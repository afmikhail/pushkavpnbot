<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PushkaVPN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Onest:wght@300;400;500;600&display=swap');
  :root {
    --bg:#0d0d0d; --surface:#161616; --surface2:#1e1e1e; --surface3:#262626;
    --accent:#e53935; --accent2:#ff5252;
    --red:#e53935; --green:#4caf50;
    --text:#f0f0f0; --muted:#777788; --border:rgba(255,255,255,0.08);
    --radius:14px; --radius-sm:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Onest',sans-serif;
    background:#000;
    color:var(--text);
    overflow-x:hidden;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    height:100%;
    min-height:100vh;
    position:relative;
  }
  .screen{display:none;flex-direction:column;flex:1;overflow:hidden}
  .screen.active{display:flex}
  .app-header{
    padding:12px 16px 10px;
    padding-top:max(env(safe-area-inset-top),12px);
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .logo{display:flex;align-items:center;gap:10px}
  .logo-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden}
  .logo-icon img{width:100%;height:100%;object-fit:cover;border-radius:8px}
  .logo-text{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700}
  .refresh-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--muted);font-size:12px;cursor:pointer;font-family:'Onest',sans-serif}
  .bottom-nav{
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;
    flex-shrink:0;
    padding-bottom:max(env(safe-area-inset-bottom),10px);
  }
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;cursor:pointer;color:var(--muted);font-size:10px;font-weight:500;transition:color 0.2s;border:none;background:none;font-family:'Onest',sans-serif}
  .nav-item.active{color:var(--accent)}
  .nav-item svg{width:20px;height:20px}
  .scroll-content{flex:1;overflow-y:auto;padding:14px 14px 20px;display:flex;flex-direction:column;gap:11px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
  .hero-card{background:linear-gradient(135deg,#1a0000 0%,#3d0000 50%,#600000 100%);border:1px solid rgba(229,57,53,0.3);border-radius:var(--radius);padding:20px 18px;position:relative;overflow:hidden}
  .hero-card::before{content:'';position:absolute;top:-40%;right:-20%;width:160px;height:160px;background:rgba(229,57,53,0.12);border-radius:50%}
  .hero-card::after{content:'';position:absolute;bottom:-40%;left:-10%;width:120px;height:120px;background:rgba(229,57,53,0.07);border-radius:50%}
  .hero-welcome{font-family:'Unbounded',sans-serif;font-size:clamp(14px,4.5vw,18px);font-weight:700;margin-bottom:8px;position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(229,57,53,0.25);border:1px solid rgba(229,57,53,0.4);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;position:relative;z-index:1;color:#ff8a80}
  .trial-card{background:var(--surface2);border:1px solid rgba(229,57,53,0.25);border-radius:var(--radius);padding:18px;text-align:center}
  .trial-icon{width:48px;height:48px;background:var(--accent);border-radius:12px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:22px}
  .trial-stats{display:flex;justify-content:center;gap:28px;margin:12px 0}
  .trial-stat{text-align:center}
  .trial-stat-num{font-family:'Unbounded',sans-serif;font-size:24px;font-weight:900;line-height:1;color:var(--accent2)}
  .trial-stat-label{color:var(--muted);font-size:11px;margin-top:3px}
  .btn{width:100%;padding:13px;border:none;border-radius:var(--radius-sm);font-family:'Onest',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-primary{background:var(--accent);color:white}
  .btn-primary:active{transform:scale(0.98);opacity:0.85}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn:disabled{opacity:0.4;cursor:not-allowed}
  .plan-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden}
  .plan-card:active{transform:scale(0.99)}
  .plan-card.featured{border-color:rgba(229,57,53,0.5);background:rgba(229,57,53,0.06)}
  .featured-badge{position:absolute;top:0;right:14px;background:var(--accent);color:white;font-size:9px;font-weight:700;padding:2px 8px;border-radius:0 0 6px 6px;letter-spacing:0.5px}
  .plan-name{font-weight:600;font-size:14px;margin-bottom:4px}
  .plan-meta{color:var(--muted);font-size:11px;display:flex;gap:8px;flex-wrap:wrap}
  .plan-price{font-family:'Unbounded',sans-serif;font-size:17px;font-weight:700;text-align:right;color:var(--accent2)}
  .plan-price-sub{color:var(--muted);font-size:10px;text-align:right}
  .status-active{display:flex;align-items:center;gap:8px;background:rgba(76,175,80,0.1);border:1px solid rgba(76,175,80,0.3);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;font-weight:500;color:var(--green)}
  .status-inactive{display:flex;align-items:center;gap:8px;background:rgba(229,57,53,0.1);border:1px solid rgba(229,57,53,0.3);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;font-weight:500;color:var(--red)}
  .balance-big{font-family:'Unbounded',sans-serif;font-size:32px;font-weight:900;color:var(--accent2)}
  .input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 14px;color:var(--text);font-family:'Onest',sans-serif;font-size:14px;outline:none}
  .input::placeholder{color:var(--muted)}
  .input:focus{border-color:var(--accent)}
  .vless-block{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;word-break:break-all;font-family:monospace;font-size:10px;color:var(--muted);margin-bottom:10px}
  .pay-method{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:space-between}
  .pay-method:active{transform:scale(0.99);border-color:rgba(229,57,53,0.4)}
  .pay-method-left{display:flex;align-items:center;gap:10px}
  .pay-method-name{font-weight:600;font-size:14px}
  .pay-method-sub{color:var(--muted);font-size:11px}
  .section-header{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:700}
  #loading{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:999}
  #loading-text{color:var(--muted);font-size:13px}
  #lottie-loader{width:120px;height:120px}
  #toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--border);border-radius:20px;padding:8px 18px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1}
  .fade-in{animation:fadeIn 0.2s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .amount-btns{display:flex;gap:8px;flex-wrap:wrap}
  .amount-btn{flex:1;min-width:70px;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Onest',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all 0.2s}
  .amount-btn.selected{border-color:var(--accent);background:rgba(229,57,53,0.12);color:var(--accent2)}
  .amount-btn:active{transform:scale(0.97)}
  .divider{height:1px;background:var(--border);margin:4px 0}
  /* guide */
  .gtabs{display:flex;gap:6px;margin-bottom:14px}
  .gtab{flex:1;padding:8px 4px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:'Onest',sans-serif;transition:all 0.15s}
  .gtab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .gpanel{display:none}
  .gpanel.on{display:block}
  .gstep{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
  .gstep:last-child{border-bottom:none;padding-bottom:0}
  .gnum{width:22px;height:22px;border-radius:50%;flex-shrink:0;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;margin-top:1px}
  .gtitle{font-size:13px;font-weight:600;margin-bottom:2px}
  .gdesc{font-size:12px;color:var(--muted);line-height:1.5}
  .gdl{display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:6px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:500;text-decoration:none}
</style>
</head>
<body>
<div id="app">

<div id="loading">
  <div id="lottie-loader"></div>

</div>

<div id="toast"></div>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="app-header">
    <div class="logo"><div class="logo-icon"><img src="logo.png" alt="PushkaVPN"></div><div class="logo-text">PushkaVPN</div></div>
    <button class="refresh-btn" onclick="refreshData()">↻ Обновить</button>

  <div class="scroll-content fade-in">

<!-- SUBSCRIPTION -->
<div class="screen" id="screen-sub">

  <div class="scroll-content fade-in">

</div>

<div class="screen" id="screen-support">

  <div class="scroll-content fade-in">
    <div class="card" style="text-align:center;padding:30px 20px">

<!-- NAV -->
<nav class="bottom-nav">

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Главная

<script>
const API_BASE = 'https://vpnpushka.ru';
const BOT_USERNAME = 'pushka_vpnbot';

const tg = window.Telegram.WebApp;
tg.expand();
tg.setHeaderColor('#0d0d0d');
tg.setBackgroundColor('#0d0d0d');

let userData = null;
let selectedAmount = 500;

async function apiCall(path, options = {}) {
  const initData = tg.initData;
  if (!initData) {
    throw new Error('Нет данных авторизации Telegram. Откройте через бота.');
  }
  const headers = {
    'Content-Type': 'application/json',
    'x-init-data': initData,
    'bypass-tunnel-reminder': 'true',
    ...(options.headers || {}),
  };
  const resp = await fetch(API_BASE + path, { ...options, headers });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ detail: resp.statusText }));
    throw new Error(err.detail || `HTTP ${resp.status}`);
  }
  return resp.json();
}

async function loadData() {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('loading-text').textContent = 'Загрузка...';
  try {
    userData = await apiCall('/api/user');
    renderAll();
    document.getElementById('loading').style.display = 'none';
  } catch (e) {
    document.getElementById('loading-text').textContent = '❌ ' + e.message;
    setTimeout(() => {
      userData = { balance: 0, trial_used: false, subscription: { active: false }, vless_link: '', user_id: 0 };
      renderAll();
      document.getElementById('loading').style.display = 'none';
      showToast('Ошибка загрузки — проверьте соединение');
    }, 3000);
  }
}

function renderAll() {
  const tgUser = tg.initDataUnsafe?.user || {};
  const name = userData.first_name || tgUser.first_name || 'Пользователь';
  const sub = userData.subscription || {};

  document.getElementById('hero-name').textContent = `Привет, ${name}!`;
  document.getElementById('hero-badge').textContent = sub.active ? `⭐ ${sub.plan}` : '⭐ Базовый';

  // Trial block
  const trialEl = document.getElementById('trial-section');
  if (!userData.trial_used && !sub.active) {
    trialEl.innerHTML = `
      <div class="trial-card">
        <div class="trial-icon">🎁</div>
        <div style="font-family:'Unbounded',sans-serif;font-size:16px;font-weight:700;margin-bottom:6px">Пробный период</div>
        <div style="color:var(--muted);font-size:12px;margin-bottom:12px">Попробуйте PushkaVPN бесплатно</div>
        <div class="trial-stats">
          <div class="trial-stat"><div class="trial-stat-num">1</div><div class="trial-stat-label">день</div></div>
          <div class="trial-stat"><div class="trial-stat-num">5</div><div class="trial-stat-label">ГБ</div></div>
          <div class="trial-stat"><div class="trial-stat-num">1</div><div class="trial-stat-label">устройство</div></div>
        </div>
        <button class="btn btn-primary" onclick="activateTrial()">Активировать бесплатно</button>
      </div>`;
  } else {
    trialEl.innerHTML = '';
  }

  const subEl = document.getElementById('sub-status-section');
  if (sub.active) {
    const trafficLine = sub.traffic ? `<div style="color:var(--muted);font-size:11px;margin-top:4px">📊 Трафик: ${sub.traffic}</div>` : '';
    subEl.innerHTML = `<div class="status-active" style="flex-direction:column;align-items:flex-start">
      <span>✅ ${sub.plan} · до ${sub.end_date} (${sub.days_left} дн.)</span>
      ${trafficLine}
    </div>`;
  } else {
    subEl.innerHTML = `<div class="status-inactive">❌ Нет активной подписки</div>`;
  }

  const vlessEl = document.getElementById('vless-section');
  if (sub.active && userData.vless_link) {
    vlessEl.innerHTML = `
      <div class="card">
        <div style="font-weight:600;margin-bottom:10px">🔑 Ваш VLESS ключ</div>
        <div class="vless-block">${userData.vless_link}</div>
        <button class="btn btn-primary" style="margin-bottom:8px" onclick="copyVless()">📋 Скопировать ключ</button>
        <div style="display:flex;gap:8px;margin-bottom:16px">
          <button class="btn btn-outline" style="flex:1" onclick="openV2ray()">v2rayTun</button>
          <button class="btn btn-outline" style="flex:1" onclick="openHapp()">Happ</button>
        </div>
        <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:10px">Как подключиться</div>
        <div class="gtabs">
          <button class="gtab on" onclick="switchGTab('iphone',this)">iPhone</button>
          <button class="gtab" onclick="switchGTab('android',this)">Android</button>
        </div>
        <div class="gpanel on" id="gp-iphone">
          <div class="gstep">
            <div class="gnum">1</div>
            <div><div class="gtitle">Установите Happ</div>
            <div class="gdesc">Бесплатно в App Store</div>
            <a class="gdl" href="https://apps.apple.com/app/happ-proxy-utility/id6504287215">⬇ App Store</a></div>
          </div>
          <div class="gstep">
            <div class="gnum">2</div>
            <div><div class="gtitle">Импортируйте ключ</div>
            <div class="gdesc">Нажмите кнопку <b>Happ</b> выше — ключ откроется в приложении автоматически. Или скопируйте ключ и в Happ нажмите «+» → «Из буфера».</div></div>
          </div>
          <div class="gstep">
            <div class="gnum">3</div>
            <div><div class="gtitle">Нажмите Connect</div>
            <div class="gdesc">Разрешите создание VPN-профиля когда iOS спросит.</div></div>
          </div>
        </div>
        <div class="gpanel" id="gp-android">
          <div class="gstep">
            <div class="gnum">1</div>
            <div><div class="gtitle">Установите Happ</div>
            <div class="gdesc">Бесплатно в Google Play</div>
            <a class="gdl" href="https://play.google.com/store/apps/details?id=com.happproxy">⬇ Google Play</a></div>
          </div>
          <div class="gstep">
            <div class="gnum">2</div>
            <div><div class="gtitle">Импортируйте ключ</div>
            <div class="gdesc">Скопируйте ключ кнопкой выше. В Happ нажмите «+» → «Импорт из буфера обмена».</div></div>
          </div>
          <div class="gstep">
            <div class="gnum">3</div>
            <div><div class="gtitle">Нажмите Connect</div>
            <div class="gdesc">Разрешите создание VPN-профиля когда Android спросит.</div></div>
          </div>
        </div>
      </div>`;
  } else {
    vlessEl.innerHTML = '';
  }

  // Email link section
  const emailEl = document.getElementById('email-link-section');
  if (!userData.email) {
    emailEl.innerHTML = `
      <div class="card" id="email-link-card">
        <div style="font-weight:600;margin-bottom:6px">📧 Привязать почту</div>
        <div style="color:var(--muted);font-size:12px;margin-bottom:12px">Войдите на сайт pushkavpn без Telegram</div>
        <div id="el-step-email">
          <input class="input" id="el-email-input" type="email" placeholder="your@email.com">
          <label style="display:flex;align-items:flex-start;gap:8px;margin-top:10px;cursor:pointer">
            <input type="checkbox" id="el-agree-terms" style="margin-top:3px;flex-shrink:0;accent-color:var(--accent);width:14px;height:14px;cursor:pointer">
            <span style="font-size:12px;color:var(--muted);line-height:1.5">Согласен с <a href="https://vpnpushka.ru/terms" target="_blank" style="color:var(--text)">политикой конфиденциальности</a></span>
          </label>
          <button class="btn btn-primary" style="margin-top:10px" onclick="elSendCode()">Получить код</button>
        </div>
        <div id="el-step-code" style="display:none">
          <div style="color:var(--muted);font-size:12px;margin-bottom:8px">Код отправлен на <b id="el-email-show" style="color:var(--text)"></b></div>
          <input class="input" id="el-code-input" type="text" placeholder="000000" maxlength="6" inputmode="numeric" style="letter-spacing:0.25em;text-align:center;font-size:20px;font-weight:700">
          <button class="btn btn-primary" style="margin-top:8px" onclick="elVerifyCode()">Подтвердить</button>
          <button onclick="elBack()" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;margin-top:6px;display:block">← Изменить email</button>
        </div>
      </div>`;
  } else {
    emailEl.innerHTML = `<div class="card" style="display:flex;align-items:center;gap:10px;padding:14px 16px">
      <span style="font-size:18px">📧</span>
      <div style="font-size:13px"><span style="color:var(--muted)">Почта привязана:</span><br><b>${userData.email}</b></div>
    </div>`;
  }

  // Subscription tab
  document.getElementById('sub-current-status').innerHTML = sub.active
    ? `<div class="status-active">✅ ${sub.plan} · до ${sub.end_date}</div>`
    : `<div class="status-inactive">❌ Нет активной подписки</div>`;

  let plansHtml = '';
  if (!userData.trial_used && !sub.active) {
    plansHtml += `<div class="plan-card" onclick="activateTrial()" style="border-color:rgba(76,175,80,0.4)">
      <div><div class="plan-name">🎁 Пробный период</div><div class="plan-meta"><span>⏱ 1 день</span><span>📊 5 ГБ</span></div></div>
      <div><div class="plan-price" style="color:#4caf50">0 ₽</div><div class="plan-price-sub">бесплатно</div></div>
    </div>`;
  }
  plansHtml += `<div class="plan-card featured" onclick="buyPlan('month',250)">
    <div class="featured-badge">ЛУЧШИЙ ВЫБОР</div>
    <div style="flex:1">
      <div class="plan-name">📆 Месячный</div>
      <div class="plan-meta"><span>⏱ 30 дней</span><span>📊 50 ГБ</span><span>📱 2 уст.</span></div>
    </div>
    <div><div class="plan-price">250₽</div><div class="plan-price-sub">/месяц</div></div>
  </div>`;
  plansHtml += `<div class="plan-card" onclick="buyPlan('year',2490)">
    <div style="flex:1">
      <div class="plan-name">📅 Годовой</div>
      <div class="plan-meta"><span>⏱ 365 дней</span><span>📊 600 ГБ</span><span>📱 2 уст.</span></div>
    </div>
    <div><div class="plan-price">2490₽</div><div class="plan-price-sub">/год</div></div>
  </div>`;
  document.getElementById('plans-list').innerHTML = plansHtml;

  document.getElementById('balance-amount').textContent = `${parseFloat(userData.balance || 0).toFixed(2)} ₽`;
}

async function activateTrial() {
  tg.showConfirm('Активировать пробный период?\n\n⏱ 1 день · 📊 5 ГБ', async (ok) => {
    if (!ok) return;
    showToast('Активируем...');
    try {
      const res = await apiCall('/api/trial/activate', { method: 'POST' });
      if (res.success) {
        showToast('✅ Пробный период активирован!');
        await loadData();
      } else {
        tg.showAlert('❌ ' + (res.error || 'Ошибка активации'));
      }
    } catch (e) {
      tg.showAlert('❌ ' + e.message);
    }
  });
}

async function buyPlan(planKey, price) {
  const balance = parseFloat(userData?.balance || 0);
  if (balance >= price) {
    tg.showConfirm(`Купить тариф за ${price}₽?\nСпишется с баланса (у вас ${balance.toFixed(0)}₽)`, async (ok) => {
      if (!ok) return;
      showToast('Активируем...');
      try {
        const res = await apiCall('/api/subscription/activate', {
          method: 'POST',
          body: JSON.stringify({ plan: planKey }),
        });
        if (res.success) {
          showToast('✅ Подписка активирована!');
          await loadData();
        } else {
          tg.showAlert('❌ ' + (res.error || 'Ошибка'));
        }
      } catch (e) {
        tg.showAlert('❌ ' + e.message);
      }
    });
  } else {
    openInvoice({ plan: planKey });
  }
}

function selectAmount(val, btn, custom = false) {
  selectedAmount = parseFloat(val) || 0;
  if (!custom) {
    document.getElementById('custom-amount').value = '';
    document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('selected'));
    if (btn) btn.classList.add('selected');
  }
}

async function topup() {
  if (!selectedAmount || selectedAmount < 10) {
    showToast('Минимальная сумма — 10₽');
    return;
  }
  openInvoice({ plan: 'topup', amount: selectedAmount });
}

async function openInvoice({ plan, amount }) {
  showToast('Создаём счёт...');
  try {
    const body = { plan };
    if (amount) body.amount = amount;
    const res = await apiCall('/api/payment/invoice', {
      method: 'POST',
      body: JSON.stringify(body),
    });
    if (!res.invoice_link) {
      tg.showAlert('❌ Ошибка создания счёта');
      return;
    }
    tg.openInvoice(res.invoice_link, async (status) => {
      if (status === 'paid') {
        showToast('✅ Оплата прошла!');
        await loadData();
      } else if (status === 'cancelled') {
        showToast('Оплата отменена');
      }
    });
  } catch (e) {
    tg.showAlert('❌ ' + e.message);
  }
}

function switchGTab(tab, btn) {
  document.querySelectorAll('.gtab').forEach(b => b.classList.remove('on'));
  document.querySelectorAll('.gpanel').forEach(p => p.classList.remove('on'));
  btn.classList.add('on');
  const panel = document.getElementById('gp-' + tab);
  if (panel) panel.classList.add('on');
}

function copyVless() {
  const link = userData?.vless_link;
  if (link) navigator.clipboard.writeText(link).then(() => showToast('✅ Ключ скопирован!'));
}

function openDeepLink(url) {
  try {
    window.location.href = url;
  } catch(e) {
    window.open(url, '_blank');
  }
}

function openV2ray() {
  if (!userData?.vless_link) { showToast('Нет ключа'); return; }
  openDeepLink('v2raytun://import/' + encodeURIComponent(userData.vless_link));
}

function openHapp() {
  if (!userData?.vless_link) { showToast('Нет ключа'); return; }
  openDeepLink('happ://add/' + encodeURIComponent(userData.vless_link));
}

function openSupport() {
  tg.openLink('https://t.me/VpnPushka');
}

let _elEmail = '';
async function elSendCode() {
  const email = document.getElementById('el-email-input').value.trim();
  if (!email || !email.includes('@')) { showToast('Введите email'); return; }
  if (!document.getElementById('el-agree-terms')?.checked) {
    showToast('Необходимо согласиться с политикой'); return;
  }
  showToast('Отправляем код...');
  try {
    const res = await apiCall('/api/auth/link/email/send', {
      method: 'POST', body: JSON.stringify({ email }),
    });
    if (res.ok) {
      _elEmail = email;
      document.getElementById('el-email-show').textContent = email;
      document.getElementById('el-step-email').style.display = 'none';
      document.getElementById('el-step-code').style.display = 'block';
      showToast('✅ Код отправлен');
    }
  } catch(e) { tg.showAlert('❌ ' + e.message); }
}
async function elVerifyCode() {
  const code = document.getElementById('el-code-input').value.trim();
  if (code.length !== 6) { showToast('Введите 6-значный код'); return; }
  showToast('Проверяем...');
  try {
    const res = await apiCall('/api/auth/link/email/verify', {
      method: 'POST', body: JSON.stringify({ email: _elEmail, code }),
    });
    if (res.ok) {
      showToast('✅ Почта привязана!');
      await loadData();
    }
  } catch(e) { tg.showAlert('❌ ' + e.message); }
}
function elBack() {
  document.getElementById('el-step-code').style.display = 'none';
  document.getElementById('el-step-email').style.display = 'block';
  document.getElementById('el-code-input').value = '';
}

async function refreshData() {
  showToast('Обновляем...');
  await loadData();
}

function switchTab(name, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(`screen-${name}`).classList.add('active');
  btn.classList.add('active');
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

window.addEventListener('load', () => {
  lottie.loadAnimation({
    container: document.getElementById('lottie-loader'),
    renderer: 'svg',
    loop: true,
    autoplay: true,
    path: 'Connect.json',
  });
  loadData();
});
</script>
</div><!-- #app -->
</body>
</html>
