<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PushkaVPN Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000;
      --surface: #111;
      --border: #2a2a2a;
      --text: #f5f5f7;
      --muted: #86868b;
      --accent: #2997ff;
      --accent-hover: #0077ed;
      --danger: #ff453a;
      --success: #30d158;
      --warning: #ffd60a;
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: rgba(0,0,0,.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 10;
    }

    .logo {
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -.3px;
    }
    .logo span { color: var(--accent); }

    #logout-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: color .15s, border-color .15s;
    }
    #logout-btn:hover { color: var(--text); border-color: var(--muted); }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    /* ─── CARD ─── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    /* ─── LOGIN ─── */
    #login-screen { padding-top: 80px; }
    #login-screen .card { max-width: 400px; margin: 0 auto; text-align: center; }
    #login-screen h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    #login-screen p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

    /* ─── STATS ─── */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .stat-box .num {
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-box .lbl { font-size: 13px; color: var(--muted); }
    .num.accent { color: var(--accent); }
    .num.success { color: var(--success); }

    /* ─── INPUTS & TEXTAREA ─── */
    input[type="password"],
    input[type="text"],
    textarea,
    select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      padding: 12px 14px;
      outline: none;
      transition: border-color .15s;
      resize: vertical;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }
    textarea { min-height: 160px; }

    /* ─── BUTTONS ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      transition: opacity .15s, background .15s;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-sm {
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
    }
    .btn-ghost {
      background: var(--border);
      color: var(--text);
    }
    .btn-ghost:hover:not(:disabled) { background: #333; }
    .btn-danger { background: var(--danger); color: #fff; }

    /* ─── FORMAT TOOLBAR ─── */
    .toolbar {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .toolbar .fmt-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      padding: 5px 11px;
      font-size: 13px;
      cursor: pointer;
      transition: background .12s;
      font-family: inherit;
    }
    .toolbar .fmt-btn:hover { background: #222; }
    .toolbar .fmt-btn b { font-weight: 700; }
    .toolbar .fmt-btn i { font-style: italic; }

    /* ─── TARGET SELECTOR ─── */
    .target-group {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .target-btn {
      flex: 1;
      background: var(--bg);
      border: 2px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 10px 8px;
      cursor: pointer;
      text-align: center;
      font-size: 14px;
      font-family: inherit;
      transition: border-color .15s, color .15s;
      line-height: 1.3;
    }
    .target-btn .tb-icon { font-size: 20px; display: block; margin-bottom: 3px; }
    .target-btn .tb-count { font-size: 12px; color: var(--muted); }
    .target-btn.selected {
      border-color: var(--accent);
      color: var(--text);
    }
    .target-btn.selected .tb-count { color: var(--accent); }

    /* ─── PREVIEW ─── */
    .preview-wrap {
      margin-top: 12px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14px;
      min-height: 48px;
      color: #e6edf3;
      word-break: break-word;
    }
    .preview-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .preview-wrap b { font-weight: 700; }
    .preview-wrap i { font-style: italic; }
    .preview-wrap code {
      background: #1e2029;
      border-radius: 4px;
      padding: 1px 5px;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 13px;
    }
    .preview-wrap a { color: var(--accent); text-decoration: underline; }

    /* ─── PARSE MODE ─── */
    .parse-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .parse-row select {
      width: auto;
      padding: 6px 10px;
      font-size: 13px;
    }

    /* ─── SEND ROW ─── */
    .send-row {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .send-row .btn { flex: 1; min-width: 120px; }

    /* ─── RESULT BANNER ─── */
    .result-banner {
      border-radius: var(--radius);
      padding: 16px 20px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .result-banner.success { background: rgba(48,209,88,.12); border: 1px solid rgba(48,209,88,.3); color: var(--success); }
    .result-banner.error   { background: rgba(255,69,58,.12); border: 1px solid rgba(255,69,58,.3); color: var(--danger); }

    .result-banner .res-big { font-size: 28px; font-weight: 700; margin-bottom: 2px; }
    .result-banner .res-row { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 8px; }
    .result-banner .res-item { font-size: 13px; color: var(--muted); }
    .result-banner .res-item span { color: var(--text); font-weight: 600; }

    /* ─── SPINNER ─── */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── CONFIRM DIALOG ─── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      display: none;
    }
    .dialog {
      background: #1c1c1e;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px 20px;
      max-width: 380px;
      width: calc(100% - 32px);
      text-align: center;
    }
    .dialog h3 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
    .dialog p { color: var(--muted); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
    .dialog-actions { display: flex; gap: 10px; }
    .dialog-actions .btn { flex: 1; }

    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }

    .char-count { font-size: 12px; color: var(--muted); text-align: right; margin-top: 4px; }
    .char-count.warn { color: var(--warning); }
  </style>
</head>
<body>

<header>
  <div class="logo">Pushka<span>VPN</span> Admin</div>
  <button id="logout-btn" style="display:none" onclick="logout()">Выйти</button>
</header>

<!-- ─── LOGIN ─── -->
<div id="login-screen">
  <main>
    <div class="card">
      <h1>Вход</h1>
      <p>Введите секретный токен администратора</p>
      <div class="field">
        <input type="password" id="token-input" placeholder="Admin token" autocomplete="off">
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="login()">Войти</button>
      <div id="login-error" style="color:var(--danger);font-size:13px;margin-top:12px;display:none"></div>
    </div>
  </main>
</div>

<!-- ─── MAIN PANEL ─── -->
<div id="main-screen" style="display:none">
  <main>

    <!-- Result banner (shown after send) -->
    <div id="result-banner" class="result-banner"></div>

    <!-- Stats -->
    <div class="card" id="stats-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <h2 style="margin:0">Аудитория</h2>
        <button class="btn btn-ghost btn-sm" onclick="loadStats()">↻ Обновить</button>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="num accent" id="stat-total">—</div>
          <div class="lbl">Всего пользователей</div>
        </div>
        <div class="stat-box">
          <div class="num success" id="stat-active">—</div>
          <div class="lbl">Активных подписчиков</div>
        </div>
      </div>
    </div>

    <!-- Compose -->
    <div class="card">
      <h2>Рассылка</h2>

      <!-- Target -->
      <label>Получатели</label>
      <div class="target-group" id="target-group">
        <button class="target-btn selected" data-target="all" onclick="selectTarget(this)">
          <span class="tb-icon">👥</span>
          Все пользователи
          <div class="tb-count" id="tc-all">—</div>
        </button>
        <button class="target-btn" data-target="active" onclick="selectTarget(this)">
          <span class="tb-icon">✅</span>
          Активные подписчики
          <div class="tb-count" id="tc-active">—</div>
        </button>
      </div>

      <!-- Format toolbar -->
      <label>Текст сообщения (HTML)</label>
      <div class="toolbar">
        <button class="fmt-btn" onclick="fmt('b')"><b>Bold</b></button>
        <button class="fmt-btn" onclick="fmt('i')"><i>Italic</i></button>
        <button class="fmt-btn" onclick="fmt('u')"><u>Underline</u></button>
        <button class="fmt-btn" onclick="fmt('s')"><s>Strike</s></button>
        <button class="fmt-btn" onclick="fmt('code')"><code>code</code></button>
        <button class="fmt-btn" onclick="fmt('pre')">pre</button>
        <button class="fmt-btn" onclick="insertLink()">🔗 ссылка</button>
        <button class="fmt-btn" onclick="insertEmoji('🎉')">🎉</button>
        <button class="fmt-btn" onclick="insertEmoji('🔔')">🔔</button>
        <button class="fmt-btn" onclick="insertEmoji('⚡')">⚡</button>
        <button class="fmt-btn" onclick="insertEmoji('💰')">💰</button>
      </div>

      <div class="field">
        <textarea id="msg-input" placeholder="Введите текст сообщения..." oninput="updatePreview(); updateCharCount()"></textarea>
        <div class="char-count" id="char-count">0 символов</div>
      </div>

      <div class="parse-row">
        <span>Формат:</span>
        <select id="parse-mode" onchange="updatePreview()">
          <option value="HTML">HTML</option>
          <option value="MarkdownV2">Markdown V2</option>
          <option value="None">Без форматирования</option>
        </select>
      </div>

      <!-- Preview -->
      <div style="margin-top:16px">
        <div class="preview-label">Предпросмотр</div>
        <div class="preview-wrap" id="preview">
          <span style="color:var(--muted);font-size:13px">Начните вводить текст…</span>
        </div>
      </div>

      <!-- Send -->
      <div class="send-row">
        <button class="btn btn-ghost" id="clear-btn" onclick="clearForm()">Очистить</button>
        <button class="btn btn-primary" id="send-btn" onclick="confirmSend()">📢 Отправить</button>
      </div>
    </div>

  </main>
</div>

<!-- ─── CONFIRM DIALOG ─── -->
<div class="overlay" id="confirm-overlay">
  <div class="dialog">
    <h3>Подтверждение рассылки</h3>
    <p id="confirm-text"></p>
    <div class="dialog-actions">
      <button class="btn btn-ghost" onclick="closeDialog()">Отмена</button>
      <button class="btn btn-primary" id="confirm-ok-btn" onclick="doSend()">Отправить</button>
    </div>
  </div>
</div>

<script>
  const API = 'https://vpnpushka.ru';
  let adminToken = '';
  let statsData = { total: 0, active: 0 };

  // ─── AUTH ───
  function login() {
    const t = document.getElementById('token-input').value.trim();
    if (!t) return;
    adminToken = t;
    localStorage.setItem('pushka_admin_token', t);
    verifyToken();
  }

  async function verifyToken() {
    try {
      const r = await apiFetch('GET', '/api/admin/stats');
      if (r.ok) {
        showMain();
        statsData = await r.json();
        renderStats();
      } else {
        showLoginError('Неверный токен');
      }
    } catch (e) {
      showLoginError('Ошибка подключения к серверу');
    }
  }

  function showLoginError(msg) {
    const el = document.getElementById('login-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function showMain() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'block';
    document.getElementById('logout-btn').style.display = '';
  }

  function logout() {
    localStorage.removeItem('pushka_admin_token');
    adminToken = '';
    document.getElementById('login-screen').style.display = 'block';
    document.getElementById('main-screen').style.display = 'none';
    document.getElementById('logout-btn').style.display = 'none';
    document.getElementById('token-input').value = '';
  }

  // ─── API ───
  function apiFetch(method, path, body) {
    const opts = {
      method,
      headers: { 'X-Admin-Token': adminToken, 'Content-Type': 'application/json' },
    };
    if (body) opts.body = JSON.stringify(body);
    return fetch(API + path, opts);
  }

  // ─── STATS ───
  async function loadStats() {
    try {
      const r = await apiFetch('GET', '/api/admin/stats');
      if (!r.ok) return;
      statsData = await r.json();
      renderStats();
    } catch (e) { /* ignore */ }
  }

  function renderStats() {
    document.getElementById('stat-total').textContent = statsData.total_users ?? '—';
    document.getElementById('stat-active').textContent = statsData.active_subscribers ?? '—';
    document.getElementById('tc-all').textContent = (statsData.total_users ?? '—') + ' чел.';
    document.getElementById('tc-active').textContent = (statsData.active_subscribers ?? '—') + ' чел.';
  }

  // ─── TARGET ───
  function selectTarget(btn) {
    document.querySelectorAll('.target-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }

  function getTarget() {
    const sel = document.querySelector('.target-btn.selected');
    return sel ? sel.dataset.target : 'all';
  }

  function getTargetLabel() {
    const t = getTarget();
    if (t === 'active') return `${statsData.active_subscribers ?? '?'} активных подписчиков`;
    return `${statsData.total_users ?? '?'} пользователей`;
  }

  // ─── FORMAT ───
  function fmt(tag) {
    const ta = document.getElementById('msg-input');
    const start = ta.selectionStart, end = ta.selectionEnd;
    const sel = ta.value.slice(start, end);
    const open = `<${tag}>`, close = `</${tag}>`;
    const rep = sel ? `${open}${sel}${close}` : `${open}${close}`;
    ta.value = ta.value.slice(0, start) + rep + ta.value.slice(end);
    const cur = start + (sel ? rep.length : open.length);
    ta.setSelectionRange(cur, cur);
    ta.focus();
    updatePreview();
    updateCharCount();
  }

  function insertLink() {
    const url = prompt('URL ссылки:', 'https://');
    if (!url) return;
    const text = prompt('Текст ссылки:', url);
    const ta = document.getElementById('msg-input');
    const start = ta.selectionStart, end = ta.selectionEnd;
    const insert = `<a href="${url}">${text || url}</a>`;
    ta.value = ta.value.slice(0, start) + insert + ta.value.slice(end);
    ta.setSelectionRange(start + insert.length, start + insert.length);
    ta.focus();
    updatePreview();
    updateCharCount();
  }

  function insertEmoji(e) {
    const ta = document.getElementById('msg-input');
    const pos = ta.selectionStart;
    ta.value = ta.value.slice(0, pos) + e + ta.value.slice(pos);
    ta.setSelectionRange(pos + e.length, pos + e.length);
    ta.focus();
    updatePreview();
    updateCharCount();
  }

  // ─── PREVIEW ───
  function updatePreview() {
    const txt = document.getElementById('msg-input').value;
    const mode = document.getElementById('parse-mode').value;
    const el = document.getElementById('preview');
    if (!txt) {
      el.innerHTML = '<span style="color:var(--muted);font-size:13px">Начните вводить текст…</span>';
      return;
    }
    if (mode === 'HTML') {
      // Render HTML tags that Telegram supports
      const safe = txt
        .replace(/&/g, '&amp;')
        .replace(/</g, '\x01')
        .replace(/>/g, '\x02');
      const allowed = ['b','strong','i','em','u','s','strike','del','code','pre','a'];
      let html = safe;
      for (const tag of allowed) {
        const re1 = new RegExp(`\\x01${tag}(\\s[^\\x02]*)?\\x02`, 'gi');
        const re2 = new RegExp(`\\x01\\/${tag}\\x02`, 'gi');
        html = html.replace(re1, `<${tag}$1>`).replace(re2, `</${tag}>`);
      }
      // Handle <a href="...">
      html = html.replace(/\x01a\s+href="([^"]+)"\x02/gi, '<a href="$1" target="_blank" rel="noreferrer">');
      html = html.replace(/\x01\/a\x02/gi, '</a>');
      html = html.replace(/\x01[^\x02]*\x02/g, ''); // strip remaining unknown tags
      el.innerHTML = html.replace(/\n/g, '<br>');
    } else {
      el.textContent = txt;
    }
  }

  function updateCharCount() {
    const len = document.getElementById('msg-input').value.length;
    const el = document.getElementById('char-count');
    el.textContent = len + ' символов';
    el.className = 'char-count' + (len > 3500 ? ' warn' : '');
  }

  // ─── SEND FLOW ───
  function clearForm() {
    document.getElementById('msg-input').value = '';
    updatePreview();
    updateCharCount();
    document.getElementById('result-banner').style.display = 'none';
  }

  function confirmSend() {
    const msg = document.getElementById('msg-input').value.trim();
    if (!msg) { alert('Введите текст сообщения'); return; }

    document.getElementById('confirm-text').textContent =
      `Отправить сообщение ${getTargetLabel()}?`;
    document.getElementById('confirm-overlay').style.display = 'flex';
  }

  function closeDialog() {
    document.getElementById('confirm-overlay').style.display = 'none';
  }

  async function doSend() {
    closeDialog();
    const msg = document.getElementById('msg-input').value.trim();
    const target = getTarget();
    const parseMode = document.getElementById('parse-mode').value;
    const btn = document.getElementById('send-btn');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Отправка…';

    try {
      const r = await apiFetch('POST', '/api/admin/broadcast', {
        message: msg,
        target,
        parse_mode: parseMode,
      });
      const data = await r.json();

      if (!r.ok) {
        showResult('error', `Ошибка: ${data.detail || 'Неизвестная ошибка'}`);
      } else {
        showResult('success', data);
      }
    } catch (e) {
      showResult('error', `Ошибка подключения: ${e.message}`);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '📢 Отправить';
    }
  }

  function showResult(type, data) {
    const el = document.getElementById('result-banner');
    el.className = 'result-banner ' + type;

    if (type === 'error') {
      el.innerHTML = `<div>❌ ${typeof data === 'string' ? data : JSON.stringify(data)}</div>`;
    } else {
      el.innerHTML = `
        <div class="res-big">✅ Отправлено: ${data.sent}</div>
        <div class="res-row">
          <div class="res-item">Всего: <span>${data.total}</span></div>
          <div class="res-item">Заблокировали: <span>${data.blocked}</span></div>
          <div class="res-item">Ошибки: <span>${data.failed}</span></div>
        </div>
      `;
    }
    el.style.display = 'block';
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ─── KEYBOARD ───
  document.getElementById('token-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  // ─── INIT ───
  const saved = localStorage.getItem('pushka_admin_token');
  if (saved) {
    adminToken = saved;
    verifyToken();
  }
</script>
</body>
</html>
